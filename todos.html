<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 500px;
      padding: 30px;
    }

    h1 {
      color: #333;
      margin-bottom: 30px;
      text-align: center;
      font-size: 2em;
    }

    .input-container {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 5px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #667eea;
    }

    button {
      padding: 12px 25px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
      font-weight: 600;
    }

    button:hover {
      background: #5568d3;
    }

    .filter-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .filter-btn {
      padding: 8px 15px;
      background: #f0f0f0;
      color: #333;
      border: 2px solid transparent;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 14px;
    }

    .filter-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }

    .filter-btn:hover {
      border-color: #667eea;
    }

    .todos-list {
      max-height: 500px;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 5px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .todo-item:hover {
      background: #f0f0f0;
      transform: translateX(5px);
    }

    .todo-item.completed {
      opacity: 0.6;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #999;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .todo-text {
      flex: 1;
      color: #333;
      font-size: 16px;
      word-break: break-word;
    }

    .delete-btn {
      padding: 6px 12px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s;
    }

    .delete-btn:hover {
      background: #ff5252;
    }

    .empty-state {
      text-align: center;
      color: #999;
      padding: 40px 20px;
      font-size: 16px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 5px;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .stats span {
      font-weight: 600;
      color: #333;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📝 Todo List</h1>

    <div class="input-container">
      <input 
        type="text" 
        id="todoInput" 
        placeholder="Add a new todo..." 
        onkeypress="if(event.key==='Enter') addTodo()"
      >
      <button onclick="addTodo()">Add</button>
    </div>

    <div class="filter-buttons">
      <button class="filter-btn active" onclick="filterTodos('all')">All</button>
      <button class="filter-btn" onclick="filterTodos('active')">Active</button>
      <button class="filter-btn" onclick="filterTodos('completed')">Completed</button>
    </div>

    <div class="todos-list" id="todosList"></div>

    <div class="empty-state" id="emptyState">
      No todos yet. Add one to get started! 🚀
    </div>

    <div class="stats">
      <div>Total: <span id="totalCount">0</span></div>
      <div>Completed: <span id="completedCount">0</span></div>
      <div>Active: <span id="activeCount">0</span></div>
    </div>
  </div>

  <script>
    let todos = JSON.parse(localStorage.getItem('todos')) || [];
    let currentFilter = 'all';

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function addTodo() {
      const input = document.getElementById('todoInput');
      const text = input.value.trim();

      if (text === '') {
        alert('Please enter a todo!');
        return;
      }

      const newTodo = {
        id: Date.now(),
        text: text,
        completed: false,
        createdAt: new Date().toLocaleString()
      };

      todos.push(newTodo);
      saveTodos();
      input.value = '';
      renderTodos();
    }

    function deleteTodo(id) {
      todos = todos.filter(todo => todo.id !== id);
      saveTodos();
      renderTodos();
    }

    function toggleTodo(id) {
      const todo = todos.find(t => t.id === id);
      if (todo) {
        todo.completed = !todo.completed;
        saveTodos();
        renderTodos();
      }
    }

    function filterTodos(filter) {
      currentFilter = filter;

      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      renderTodos();
    }

    function getFilteredTodos() {
      switch (currentFilter) {
        case 'active':
          return todos.filter(todo => !todo.completed);
        case 'completed':
          return todos.filter(todo => todo.completed);
        default:
          return todos;
      }
    }

    function updateStats() {
      document.getElementById('totalCount').textContent = todos.length;
      document.getElementById('completedCount').textContent = 
        todos.filter(t => t.completed).length;
      document.getElementById('activeCount').textContent = 
        todos.filter(t => !t.completed).length;
    }

    function renderTodos() {
      const todosList = document.getElementById('todosList');
      const emptyState = document.getElementById('emptyState');
      const filteredTodos = getFilteredTodos();

      todosList.innerHTML = '';

      if (filteredTodos.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        filteredTodos.forEach(todo => {
          const todoItem = document.createElement('div');
          todoItem.className = `todo-item ${todo.completed ? 'completed' : ''}`;
          todoItem.innerHTML = `
            <input 
              type="checkbox" 
              ${todo.completed ? 'checked' : ''} 
              onchange="toggleTodo(${todo.id})"
            >
            <div class="todo-text">${escapeHtml(todo.text)}</div>
            <button class="delete-btn" onclick="deleteTodo(${todo.id})">Delete</button>
          `;
          todosList.appendChild(todoItem);
        });
      }

      updateStats();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial render
    renderTodos();
  </script>

</body>
</html>
